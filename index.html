  :root {
    --ink: #0b3630;
    --ink-deep: #082722;
    --ink-soft: #124a42;
    --paper: #f7f0da;
    --paper-dim: rgba(247, 240, 218, 0.72);
    --paper-faint: rgba(247, 240, 218, 0.4);
    --accent: #9cbb92;
    --accent-soft: rgba(156, 187, 146, 0.35);
    --line: rgba(247, 240, 218, 0.16);
    --focus: #cddcc6;
  }

  * { box-sizing: border-box; }

  html { color-scheme: dark; }

  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--ink);
    color: var(--paper);
    font-family: 'SuisseIntl', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10vh 24px 40px;
    position: relative;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ambient ground: soft radial field + faint concentric rings + grain */
  .field {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(60% 50% at 50% 38%, var(--ink-soft) 0%, transparent 65%),
      radial-gradient(110% 90% at 50% 100%, var(--ink-deep) 0%, transparent 60%),
      var(--ink);
  }

  .rings {
    position: fixed;
    left: 50%;
    top: 38%;
    width: min(120vw, 1400px);
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    z-index: 0;
    pointer-events: none;
    opacity: 0.5;
  }
  .rings svg { width: 100%; height: 100%; display: block; }
  .rings circle {
    fill: none;
    stroke: var(--paper);
    stroke-opacity: 0.05;
    transform-box: fill-box;
    transform-origin: center;
  }

  @media (prefers-reduced-motion: no-preference) {
    .rings circle:nth-child(1) { animation: ripple 7s ease-out infinite; }
    .rings circle:nth-child(2) { animation: ripple 7s ease-out infinite 2.3s; }
    .rings circle:nth-child(3) { animation: ripple 7s ease-out infinite 4.6s; }
  }

  @keyframes ripple {
    0%   { transform: scale(0.82); stroke-opacity: 0; }
    12%  { stroke-opacity: 0.09; }
    100% { transform: scale(1.18); stroke-opacity: 0; }
  }

  .grain {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.05;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size: 180px 180px;
  }

  main {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 620px;
    text-align: center;
  }

  .mark {
    width: min(72vw, 420px);
    height: auto;
    color: var(--paper);
    filter: drop-shadow(0 18px 60px rgba(0, 0, 0, 0.35));
  }
  .mark .cls-1 { fill: currentColor; }

  .lg-left, .lg-right, .lg-dot { transform-box: fill-box; transform-origin: center; }

  @media (prefers-reduced-motion: no-preference) {
    .lg-left  { animation: slide-in-l 950ms cubic-bezier(.16,1,.3,1) both; }
    .lg-right { animation: slide-in-r 950ms cubic-bezier(.16,1,.3,1) both; }
    .lg-dot   { animation: dot-in 700ms cubic-bezier(.34,1.56,.64,1) 620ms both,
                           dot-breathe 4600ms ease-in-out 1500ms infinite; }
  }

  @keyframes slide-in-l { from { opacity: 0; transform: translateX(-3.5%); } to { opacity: 1; transform: translateX(0); } }
  @keyframes slide-in-r { from { opacity: 0; transform: translateX(3.5%); } to { opacity: 1; transform: translateX(0); } }
  @keyframes dot-in { from { opacity: 0; transform: scale(0.15); } to { opacity: 1; transform: scale(1); } }
  @keyframes dot-breathe {
    0%, 100% { filter: drop-shadow(0 0 0 rgba(156,187,146,0)); }
    50% { filter: drop-shadow(0 0 14px rgba(156,187,146,0.9)); }
  }

  .kicker {
    margin: 40px 0 0;
    font-family: 'SuisseIntl Light', 'SuisseIntl', sans-serif;
    font-weight: 300;
    font-size: clamp(12px, 2.6vw, 14px);

  }

  h1 {
    margin: 22px 0 0;

  form.signup {
    margin: 44px 0 0;
    width: 100%;
    max-width: 420px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 12px;
    transition: border-color 220ms ease;
  }

  }

  form.signup input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: 0;
    outline: 0;

    font-size: 15px;
    padding: 6px 2px;

  .send {

    width: 40px;
    height: 40px;
    border-radius: 999px;

    background: transparent;
    color: var(--paper);
    cursor: pointer;

    align-items: center;
    justify-content: center;

  .send:hover { border-color: var(--accent); background: var(--accent-soft); }
  .send:active { transform: scale(0.94); }
  .send:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  .send svg { width: 16px; height: 16px; }

  .status {
    margin-top: 14px;
    font-size: 13px;
    color: var(--paper-dim);

    z-index: 2;
    margin-top: 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;

  }

  @media (prefers-reduced-motion: no-preference) {

  }

  .contact-row {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;

  .contact-row a {

  .contact-row a:hover,

  .rights { color: rgba(247, 240, 218, 0.32); font-size: 12px; }

  .cookie-banner {

    right: 16px;

  @media (max-width: 420px) {

<script>
  (function () {
    var form = document.getElementById('signup-form');
    var status = document.getElementById('signup-status');
    var email = document.getElementById('email');
    var sendBtn = form.querySelector('.send');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!email.value || !email.checkValidity()) {
        status.textContent = 'Please enter a valid email address.';
        status.classList.remove('is-visible');
        return;
      }

      sendBtn.disabled = true;
      status.textContent = 'Sending…';
      status.classList.remove('is-visible');

      fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: new FormData(form)
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data.success) {
            status.textContent = "You're on the list — we'll be in touch when we launch.";
            status.classList.add('is-visible');
            email.value = '';
            email.disabled = true;
          } else {
            status.textContent = "Something went wrong — please try again.";
            sendBtn.disabled = false;
          }
        })
        .catch(function () {
          status.textContent = "Something went wrong — please try again.";
          sendBtn.disabled = false;
        });
    });
  })();

  (function () {
    try {
      var KEY = 'cg-cookie-ack';
      var banner = document.getElementById('cookie-banner');
      var accept = document.getElementById('cookie-accept');
      if (!banner || !accept) return;
      if (!localStorage.getItem(KEY)) {
        banner.hidden = false;
      }
      accept.addEventListener('click', function () {
        try { localStorage.setItem(KEY, '1'); } catch (e) {}
        banner.hidden = true;
      });
    } catch (e) {
      /* localStorage unavailable — leave banner hidden rather than nag every load */
    }
  })();
</script>
