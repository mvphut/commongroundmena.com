<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Common Ground</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0b3630">
<style>
  :root { --ink: #0b3630; --paper: #f7f0da; --paper-dim: rgba(247, 240, 218, 0.68); }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--ink);
    color: var(--paper);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  }
  .dot { width: 36px; height: 36px; border-radius: 50%; background: var(--paper); }
  h1 { font-size: clamp(20px, 4vw, 26px); font-weight: 500; margin: 0; }
  p { color: var(--paper-dim); margin: 0; max-width: 40ch; }
  a { color: var(--paper); border-bottom: 1px solid rgba(247,240,218,0.3); text-decoration: none; padding-bottom: 2px; }
  a:hover { border-color: var(--paper); }
</style>
</head>
<body>
  <div class="dot" aria-hidden="true"></div>
  <h1>This page doesn't exist.</h1>
  <p>The link you followed may be broken, or the page may have moved.</p>
  <a href="/">Back to Common Ground</a>
</body>
</html>
